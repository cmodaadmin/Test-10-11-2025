<app-page-header title="Browse Vendors" subtitle="Invite the right partners to your RFQs"></app-page-header>
<div class="salesforce-card mb-4">
  <div class="row g-3 align-items-end">
    <div class="col-md-6">
      <label class="form-label">Search vendors</label>
      <input class="form-control" [(ngModel)]="search" name="search" />
    </div>
    <div class="col-md-3">
      <button class="btn btn-primary w-100" (click)="load()">Search</button>
    </div>
  </div>
</div>
<div class="row g-4">
  <div class="col-md-4" *ngFor="let vendor of vendors">
    <div class="salesforce-card h-100">
      <h5 class="fw-semibold">{{ vendor.companyName }}</h5>
      <p class="text-muted">{{ vendor.city }}, {{ vendor.state }}</p>
      <div class="d-flex flex-wrap gap-2 mb-3">
        <span class="badge bg-light text-dark" *ngFor="let service of vendor.services">{{ service.name }}</span>
      </div>
      <a [routerLink]="['/customer/rfqs/new']" class="btn btn-outline-primary btn-sm">Invite to RFQ</a>
    </div>
  </div>
</div>
