<section class="container py-5" style="max-width: 560px;">
  <div class="salesforce-card">
    <h2 class="h4 fw-semibold mb-3">Forgot Password</h2>
    <p class="text-muted">Enter your registered email address to receive reset instructions.</p>
    <form [formGroup]="form" (ngSubmit)="submit()" class="row g-3">
      <div class="col-12">
        <label class="form-label">Email</label>
        <input class="form-control" formControlName="email" type="email" />
      </div>
      <div class="col-12">
        <button class="btn btn-primary" type="submit">Send reset link</button>
      </div>
      <div class="col-12" *ngIf="message">
        <div class="alert alert-success">{{ message }}</div>
      </div>
    </form>
  </div>
</section>
