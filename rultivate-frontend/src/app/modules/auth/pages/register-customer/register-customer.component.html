<section class="container py-5" style="max-width: 720px;">
  <div class="salesforce-card">
    <h2 class="h4 fw-semibold mb-4">Create a customer account</h2>
    <form [formGroup]="form" (ngSubmit)="submit()" class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Full Name</label>
        <input class="form-control" formControlName="fullName" />
      </div>
      <div class="col-md-6">
        <label class="form-label">Company</label>
        <input class="form-control" formControlName="company" />
      </div>
      <div class="col-md-6">
        <label class="form-label">Email</label>
        <input class="form-control" formControlName="email" type="email" />
      </div>
      <div class="col-md-6">
        <label class="form-label">Phone</label>
        <input class="form-control" formControlName="phone" />
      </div>
      <div class="col-12">
        <label class="form-label">Password</label>
        <input class="form-control" formControlName="password" type="password" />
      </div>
      <div class="col-12">
        <button class="btn btn-primary" type="submit">Register</button>
      </div>
      <div class="col-12" *ngIf="error">
        <div class="alert alert-danger">{{ error }}</div>
      </div>
    </form>
  </div>
</section>
