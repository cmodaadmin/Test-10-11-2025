<section class="container py-5">
  <app-page-header title="Frequently Asked Questions" subtitle="Answers for customers and vendors"></app-page-header>
  <div class="accordion" id="faqAccordion">
    <div class="accordion-item" *ngFor="let faq of faqs; let i = index">
      <h2 class="accordion-header" [id]="'faq-heading-' + i">
        <button class="accordion-button" type="button" data-bs-toggle="collapse" [attr.data-bs-target]="'#faq-collapse-' + i" aria-expanded="i === 0" [attr.aria-controls]="'faq-collapse-' + i">
          {{ faq.title }}
        </button>
      </h2>
      <div [id]="'faq-collapse-' + i" class="accordion-collapse collapse" [class.show]="i === 0" [attr.aria-labelledby]="'faq-heading-' + i" data-bs-parent="#faqAccordion">
        <div class="accordion-body" [innerHTML]="faq.content"></div>
      </div>
    </div>
  </div>
</section>
