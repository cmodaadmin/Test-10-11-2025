<div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center mb-4">
  <div>
    <h1 class="h3 mb-1">{{ title }}</h1>
    <p class="text-muted mb-0" *ngIf="subtitle">{{ subtitle }}</p>
  </div>
  <div class="d-flex gap-2 mt-3 mt-md-0" *ngIf="actions.length">
    <ng-container *ngFor="let action of actions">
      <a *ngIf="action.link" [routerLink]="action.link" class="btn btn-primary d-flex align-items-center gap-2">
        <i *ngIf="action.icon" class="bi" [ngClass]="action.icon"></i>
        {{ action.label }}
      </a>
      <button *ngIf="!action.link" class="btn btn-outline-primary d-flex align-items-center gap-2" (click)="action.handler && action.handler()">
        <i *ngIf="action.icon" class="bi" [ngClass]="action.icon"></i>
        {{ action.label }}
      </button>
    </ng-container>
  </div>
</div>
