<div class="d-flex">
  <nav class="salesforce-sidebar d-none d-lg-flex flex-column p-4" *ngIf="(user$ | async) as user">
    <div class="d-flex align-items-center mb-4">
      <div class="bg-white rounded-circle d-flex align-items-center justify-content-center" style="width: 44px; height: 44px;">
        <span class="fw-bold text-primary">R</span>
      </div>
      <div class="ms-3">
        <div class="fw-semibold">Rultivate</div>
        <small class="text-white-50">Market Network</small>
      </div>
    </div>
    <div class="nav-link-role mb-2">{{ user.primaryRole | uppercase }}</div>
    <a routerLink="/customer" routerLinkActive="active" *ngIf="user.roles.includes('customer')">Customer Workspace</a>
    <a routerLink="/vendor" routerLinkActive="active" *ngIf="user.roles.includes('vendor')">Vendor Workspace</a>
    <a routerLink="/admin" routerLinkActive="active" *ngIf="user.roles.some(r => r.startsWith('dept_') || r === 'super_admin')">Admin Console</a>
  </nav>

  <div class="flex-grow-1">
    <header class="salesforce-topbar d-flex align-items-center justify-content-between">
      <div class="d-flex align-items-center gap-3">
        <button class="btn btn-outline-primary d-lg-none" type="button">
          <i class="bi bi-list"></i>
        </button>
        <input type="search" class="form-control border-0 bg-light" placeholder="Search vendors, RFQs, orders" />
      </div>
      <div class="d-flex align-items-center gap-3">
        <div class="position-relative">
          <button class="btn btn-light rounded-circle position-relative">
            <i class="bi bi-bell"></i>
            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">3</span>
          </button>
        </div>
        <ng-container *ngIf="user$ | async as authUser; else guestLinks">
          <div class="dropdown">
            <button class="btn btn-light dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
              {{ authUser.fullName || authUser.email }}
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><a class="dropdown-item" routerLink="/customer/profile" *ngIf="authUser.roles.includes('customer')">My Profile</a></li>
              <li><a class="dropdown-item" routerLink="/vendor/profile" *ngIf="authUser.roles.includes('vendor')">Vendor Profile</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><button class="dropdown-item" (click)="logout()">Logout</button></li>
            </ul>
          </div>
        </ng-container>
        <ng-template #guestLinks>
          <a class="btn btn-outline-primary" routerLink="/auth/login">Sign in</a>
        </ng-template>
      </div>
    </header>
    <main class="p-4">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
